<!DOCTYPE html>
<html lang="pt" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pierre - Gestão Financeira Inteligente</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#C6FE1E',
            surface: '#121212',
            card: '#1A1A1A',
            border: '#2A2A2A'
          }
        }
      }
    }
  </script>
  
  <!-- CSS Personalizado -->
  <link rel="stylesheet" href="assets/css/custom.css" />
  
  <!-- Ícones Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="flex flex-col h-screen overflow-hidden bg-[#0A0A0A] text-white">

  <!-- BARRA SUPERIOR (HEADER) -->
  <header id="top-bar" class="flex justify-between items-center px-4 py-3 bg-black/40 backdrop-blur-md border-b border-border z-20">
    <div class="flex items-center gap-3">
      <div id="user-avatar" class="w-9 h-9 rounded-full bg-brand/20 border border-brand text-brand flex items-center justify-center font-bold text-sm">
        P
      </div>
      <div>
        <h1 id="screen-title" class="text-base font-semibold leading-tight">Olá, Utilizador</h1>
        <p id="screen-subtitle" class="text-xs text-gray-400">Resumo Financeiro</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <!-- Botão para Testar o Modal de Categorias -->
      <button onclick="toggleCategoriesModal(true)" class="p-2 rounded-full hover:bg-card text-gray-300" title="Categorias">
        <i data-lucide="tag" class="w-5 h-5"></i>
      </button>
      <button onclick="router.navigate('notifications')" class="p-2 rounded-full hover:bg-card text-gray-300">
        <i data-lucide="bell" class="w-5 h-5"></i>
      </button>
      <button onclick="router.navigate('profile')" class="p-2 rounded-full hover:bg-card text-gray-300">
        <i data-lucide="settings" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <!-- CONTAINER PRINCIPAL (SPA VIEW) -->
  <main id="app-view" class="flex-1 overflow-y-auto no-scrollbar relative p-4 pb-24">
    <!-- As vistas são injetadas aqui pelo app.js -->
  </main>

  <!-- MODAL DE CATEGORIAS -->
  <div id="categories-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex-col justify-end">
    <div class="bg-[#121212] w-full h-[85vh] rounded-t-3xl border-t border-border flex flex-col p-4 animate-slide-up">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-white">Categorias</h2>
        <button onclick="toggleCategoriesModal(false)" class="p-2 bg-card rounded-full text-gray-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      
      <div class="relative mb-4">
        <i data-lucide="search" class="w-5 h-5 absolute left-3 top-3 text-gray-400"></i>
        <input id="categories-search" type="text" placeholder="Buscar categoria..." class="w-full bg-card border border-border rounded-xl py-2.5 pl-10 pr-4 text-sm text-white focus:outline-none focus:border-brand" />
      </div>

      <div id="categories-list" class="flex-1 overflow-y-auto space-y-4 pr-1 no-scrollbar">
        <!-- Preenchido via categories-render.js -->
      </div>
    </div>
  </div>

  <!-- NAVEGAÇÃO INFERIOR -->
  <nav class="fixed bottom-0 left-0 right-0 bg-black/80 backdrop-blur-lg border-t border-border px-6 py-2 flex justify-between items-center z-30">
    <button onclick="router.navigate('dashboard')" class="nav-btn flex flex-col items-center gap-1 text-brand" data-target="dashboard">
      <i data-lucide="layout-grid" class="w-6 h-6"></i>
      <span class="text-[10px] font-medium">Início</span>
    </button>
    <button onclick="router.navigate('activities')" class="nav-btn flex flex-col items-center gap-1 text-gray-400 hover:text-white" data-target="activities">
      <i data-lucide="arrow-up-right" class="w-6 h-6"></i>
      <span class="text-[10px] font-medium">Atividades</span>
    </button>
    <button onclick="router.navigate('chat')" class="nav-btn flex flex-col items-center gap-1 text-gray-400 hover:text-white" data-target="chat">
      <i data-lucide="sparkles" class="w-6 h-6 text-brand"></i>
      <span class="text-[10px] font-medium">Pierre IA</span>
    </button>
    <button onclick="router.navigate('profile')" class="nav-btn flex flex-col items-center gap-1 text-gray-400 hover:text-white" data-target="profile">
      <i data-lucide="user" class="w-6 h-6"></i>
      <span class="text-[10px] font-medium">Perfil</span>
    </button>
  </nav>

  <!-- SCRIPTS DA APLICAÇÃO -->
  <script src="assets/js/categories-data.js"></script>
  <script src="assets/js/categories-render.js"></script>
  <script type="module" src="assets/js/app.js"></script>

  <script>
    function toggleCategoriesModal(show) {
      const modal = document.getElementById('categories-modal');
      if (show) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        if (typeof renderCategories === 'function') renderCategories();
      } else {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }
  </script>
</body>
</html>
